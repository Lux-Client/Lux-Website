version: "3.8"

services:
  lux-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lux-server
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-3001}
      - DATA_DIR=${DATA_DIR:-/app/data}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET}
      - DATABASE_URL=${DATABASE_URL}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_SSL=${DB_SSL:-false}
      - MARIADB_URL=${MARIADB_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - CALLBACK_URL=${CALLBACK_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - LUX_DISCORD_APP_ID=${LUX_DISCORD_APP_ID}
      - SITE_URL=${SITE_URL:-https://lux.pluginhub.de}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM=${RESEND_FROM:-Lux Client <noreply@pluginhub.de>}
      - EMAIL_DAILY_LIMIT=${EMAIL_DAILY_LIMIT:-100}
      - EMAIL_MONTHLY_LIMIT=${EMAIL_MONTHLY_LIMIT:-3000}
      - EMAIL_MONTH_RESET_DAY=${EMAIL_MONTH_RESET_DAY:-1}
      - EMAIL_NOTIFICATIONS=${EMAIL_NOTIFICATIONS:-false}
      - AUTH_SECRET=${AUTH_SECRET}
    volumes:
      - lux_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:' + (process.env.PORT || 3001) + '/api/admin/maintenance/status', (res) => { if (res.statusCode < 200 || res.statusCode >= 400) process.exit(1); process.exit(0); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  lux_data:
